<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'Manrope', sans-serif">

  <!-- background -->
  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF" stroke="rgba(17,17,17,0.12)" stroke-width="1"/>

  <!-- ============ PROCESSOR (left square) ============ -->
  <rect x="40" y="60" width="160" height="140" fill="#7BA3AD"/>
  <text x="120" y="118" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="18" fill="#FFFFFF">PROCESSOR</text>
  <text x="120" y="142" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" fill="#FFFFFF">lives inside the work</text>

  <!-- loop-back bracket above Processor: square-bracket loop, no curves -->
  <polyline points="70,60 70,35 170,35 170,60" fill="none" stroke="#4A4A4D" stroke-width="2"/>
  <polygon points="170,60 164,48 176,48" fill="#4A4A4D"/>

  <!-- ============ ARROW: Processor -> Architect ============ -->
  <line x1="200" y1="130" x2="500" y2="130" stroke="#4A4A4D" stroke-width="2"/>
  <polygon points="500,130 486,124 486,136" fill="#4A4A4D"/>
  <text x="350" y="118" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1" fill="#4A4A4D">THE UPGRADE</text>

  <!-- ============ ARCHITECT (right square) ============ -->
  <rect x="500" y="60" width="160" height="140" fill="#3292FF"/>
  <text x="580" y="118" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="18" fill="#FFFFFF">ARCHITECT</text>
  <text x="580" y="142" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" fill="#FFFFFF">designs the system</text>

  <!-- ============ FOOTER: three squares feeding up into Architect ============ -->

  <!-- connector verticals from each footer square up to elbow row -->
  <line x1="190" y1="280" x2="190" y2="250" stroke="#4A4A4D" stroke-width="2"/>
  <line x1="360" y1="280" x2="360" y2="250" stroke="#4A4A4D" stroke-width="2"/>
  <line x1="530" y1="280" x2="530" y2="250" stroke="#4A4A4D" stroke-width="2"/>

  <!-- elbow trunk: horizontal bus into vertical trunk feeding Architect bottom -->
  <line x1="190" y1="250" x2="580" y2="250" stroke="#4A4A4D" stroke-width="2"/>
  <line x1="580" y1="250" x2="580" y2="200" stroke="#4A4A4D" stroke-width="2"/>
  <polygon points="580,200 574,212 586,212" fill="#4A4A4D"/>

  <!-- footer square 1: Linguistic Mirroring -->
  <rect x="115" y="280" width="150" height="65" fill="#D1DDD4"/>
  <text x="190" y="308" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#4A4A4D">Linguistic</text>
  <text x="190" y="324" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#4A4A4D">Mirroring</text>

  <!-- footer square 2: Synthetic Friction -->
  <rect x="285" y="280" width="150" height="65" fill="#CDACFE"/>
  <text x="360" y="308" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#4A4A4D">Synthetic</text>
  <text x="360" y="324" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#4A4A4D">Friction</text>

  <!-- footer square 3: Protect the Peak -->
  <rect x="455" y="280" width="150" height="65" fill="#FC7142"/>
  <text x="530" y="308" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Protect the</text>
  <text x="530" y="324" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Peak</text>

</svg>
