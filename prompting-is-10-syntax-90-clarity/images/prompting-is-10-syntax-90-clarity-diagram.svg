<svg viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="180" fill="#FFFFFF"/>

  <!-- proportional split bar: 10% syntax / 90% clarity of thought -->
  <rect x="30" y="60" width="61" height="70" fill="#7BA3AD"/>
  <rect x="91" y="60" width="549" height="70" fill="#FC7142"/>

  <!-- thin frame lines, flat, no rounding -->
  <rect x="30" y="60" width="610" height="70" fill="none" stroke="rgba(17,17,17,0.12)" stroke-width="1"/>
  <line x1="91" y1="60" x2="91" y2="130" stroke="#FFFFFF" stroke-width="2"/>

  <!-- left label, rotated to fit narrow block -->
  <text x="60" y="95" transform="rotate(-90 60 95)"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'JetBrains Mono', monospace" font-size="14" fill="#FFFFFF">10% SYNTAX</text>

  <!-- right label -->
  <text x="365" y="100" text-anchor="middle" dominant-baseline="middle"
        font-family="'JetBrains Mono', monospace" font-size="20" fill="#FFFFFF">90% CLARITY OF THOUGHT</text>
</svg>
