<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Discipline runs on norepinephrine and depletes. Curiosity runs on dopamine and stays constant.">
  <rect x="0" y="0" width="700" height="260" fill="#FFFFFF"/>

  <!-- TOP: DISCIPLINE / PUSH -->
  <!-- arrow pointing away from a square (pushed) -->
  <rect x="55" y="18" width="12" height="12" fill="#FC7142"/>
  <line x1="73" y1="24" x2="180" y2="24" stroke="#FC7142" stroke-width="2"/>
  <rect x="184" y="20" width="8" height="8" fill="#FC7142" transform="rotate(45 188 24)"/>

  <line x1="40" y1="36" x2="600" y2="36" stroke="rgba(17,17,17,0.12)" stroke-width="1"/>

  <rect x="40" y="45" width="560" height="55" fill="#FC7142"/>
  <text x="55" y="70" font-family="'Rubik Mono One', monospace" font-size="18" fill="#FFFFFF">DISCIPLINE — PUSH</text>
  <text x="55" y="88" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">norepinephrine</text>

  <!-- depletion markers: shrinking left to right -->
  <rect x="310" y="62.5" width="20" height="20" fill="#FFFFFF"/>
  <rect x="367" y="64.5" width="16" height="16" fill="#FFFFFF"/>
  <rect x="424" y="66.5" width="12" height="12" fill="#FFFFFF"/>
  <rect x="481" y="68.5" width="8" height="8" fill="#FFFFFF"/>
  <rect x="537.5" y="70" width="5" height="5" fill="#FFFFFF"/>

  <!-- BOTTOM: CURIOSITY / PULL -->
  <!-- arrow pointing toward a square (pulled) -->
  <rect x="63" y="160" width="8" height="8" fill="#CDACFE" transform="rotate(45 67 164)"/>
  <line x1="75" y1="164" x2="182" y2="164" stroke="#CDACFE" stroke-width="2"/>
  <rect x="182" y="158" width="12" height="12" fill="#CDACFE"/>

  <line x1="40" y1="176" x2="600" y2="176" stroke="rgba(17,17,17,0.12)" stroke-width="1"/>

  <rect x="40" y="185" width="560" height="55" fill="#CDACFE"/>
  <text x="55" y="210" font-family="'Rubik Mono One', monospace" font-size="18" fill="#4A4A4D">CURIOSITY — PULL</text>
  <text x="55" y="228" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6E6E73">dopamine</text>

  <!-- constant markers: evenly spaced, same size -->
  <rect x="314" y="206.5" width="12" height="12" fill="#4A4A4D"/>
  <rect x="374" y="206.5" width="12" height="12" fill="#4A4A4D"/>
  <rect x="434" y="206.5" width="12" height="12" fill="#4A4A4D"/>
  <rect x="494" y="206.5" width="12" height="12" fill="#4A4A4D"/>
  <rect x="554" y="206.5" width="12" height="12" fill="#4A4A4D"/>
</svg>
