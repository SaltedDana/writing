<svg viewBox="0 0 1000 350" width="1000" height="350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What habit are you, as CEO, building today to guarantee your company is heading in the right direction?">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Inter:wght@400;600&amp;display=swap');
    .hand { font-family:'Architects Daughter','Comic Sans MS',cursive; fill:#1f2328; }
    .sub { font-family:'Inter',system-ui,sans-serif; fill:#6C8F8A; }
    .meta { font-family:'Inter',system-ui,sans-serif; fill:#6C8F8A; font-size:13px; }
  </style>
  <rect x="1" y="1" width="998" height="348" fill="#FBF8F1" stroke="#1f2328" stroke-width="2"/>
  <rect x="1" y="1" width="250" height="10" fill="#CDACFE"/>
  <rect x="251" y="1" width="200" height="10" fill="#D1DDD4"/>
  <rect x="451" y="1" width="330" height="10" fill="#7BA3AD"/>
  <rect x="781" y="1" width="218" height="10" fill="#FC7142"/>
  <text x="40" y="85" class="hand" font-size="52" font-weight="700">What habit are you, as CEO,</text>
  <text x="40" y="135" class="hand" font-size="52" font-weight="700">building today to guarantee</text>
  <text x="40" y="185" class="hand" font-size="52" font-weight="700">your company is heading in</text>
  <text x="40" y="235" class="hand" font-size="52" font-weight="700">the right direction?</text>
  <text x="40" y="305" class="sub" font-size="18">Goals are cheap. Small daily habits are what actually guide the course.</text>
  <text x="40" y="334" class="meta">Dana Maman &#183; saltedmind.co</text>
  <text x="960" y="334" class="meta" text-anchor="end">2026-01-01</text>
</svg>
