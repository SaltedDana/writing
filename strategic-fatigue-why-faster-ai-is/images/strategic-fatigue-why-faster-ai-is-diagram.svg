<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stepped funnel from 50 AI outputs to 1 decision, filtered by non-negotiables">
  <rect x="0" y="0" width="700" height="340" fill="#F5F9FC"/>

  <!-- Step 1: widest, slate -->
  <rect x="60" y="30" width="420" height="70" fill="#7BA3AD"/>
  <text x="270" y="72" font-family="'Rubik Mono One', monospace" font-size="20" fill="#FFFFFF" text-anchor="middle">50 AI OUTPUTS</text>

  <!-- Step 2: narrower, lavender -->
  <rect x="60" y="135" width="300" height="70" fill="#CDACFE"/>
  <text x="210" y="177" font-family="'Rubik Mono One', monospace" font-size="17" fill="#4A4A4D" text-anchor="middle">NON-NEGOTIABLES FILTER</text>

  <!-- Step 3: narrowest, orange -->
  <rect x="60" y="240" width="160" height="70" fill="#FC7142"/>
  <text x="140" y="282" font-family="'Rubik Mono One', monospace" font-size="18" fill="#FFFFFF" text-anchor="middle">1 DECISION</text>

  <!-- connector lines between steps (straight, 90-degree) -->
  <line x1="480" y1="100" x2="480" y2="135" stroke="rgba(17,17,17,0.12)" stroke-width="2"/>
  <line x1="360" y1="205" x2="360" y2="240" stroke="rgba(17,17,17,0.12)" stroke-width="2"/>

  <!-- Captions beside each step -->
  <rect x="520" y="58" width="10" height="10" fill="#7BA3AD"/>
  <text x="540" y="68" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6E6E73">Rules before prompting</text>

  <rect x="400" y="163" width="10" height="10" fill="#CDACFE"/>
  <text x="420" y="173" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6E6E73">Review in best-thinking windows</text>

  <rect x="260" y="268" width="10" height="10" fill="#FC7142"/>
  <text x="280" y="278" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6E6E73">AI critiques AI</text>
</svg>
