<svg viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Be clear and detailed but leave room for AI to run its magic">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Inter:wght@400;600&amp;display=swap');
    .hand { font-family:'Architects Daughter','Comic Sans MS',cursive; fill:#1f2328; }
    .sub { font-family:'Inter',system-ui,sans-serif; fill:#6C8F8A; }
