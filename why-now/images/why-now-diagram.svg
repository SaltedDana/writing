<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sinek's order vs. this essay's order</title>
  <desc id="desc">Two nested-square diagrams. Left: sage square labeled WHY containing a blue square labeled WHAT/HOW, captioned Sinek's order. Right: orange square labeled WHY NOW the pressure, containing a lavender square labeled WHY, containing a blue square labeled WHAT/HOW, captioned This essay's order.</desc>

  <rect x="0" y="0" width="700" height="320" fill="#F5F9FC"/>

  <!-- LEFT DIAGRAM: Sinek's order -->
  <rect x="40" y="20" width="200" height="200" rx="0" fill="#D1DDD4"/>
  <rect x="95" y="75" width="90" height="90" rx="0" fill="#3292FF"/>

  <text x="140" y="45" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="15" fill="#4A4A4D" letter-spacing="0.5">WHY</text>
  <text x="140" y="124" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="11" fill="#FFFFFF" letter-spacing="0.3">WHAT/HOW</text>

  <text x="140" y="300" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-style="italic" fill="#6E6E73">Sinek's order</text>

  <!-- RIGHT DIAGRAM: this essay's order -->
  <rect x="400" y="20" width="260" height="260" rx="0" fill="#FC7142"/>
  <rect x="445" y="65" width="170" height="170" rx="0" fill="#CDACFE"/>
  <rect x="485" y="105" width="90" height="90" rx="0" fill="#3292FF"/>

  <text x="530" y="39" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="13" fill="#4A4A4D" letter-spacing="0.5">WHY NOW</text>
  <text x="530" y="55" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="9" fill="#6E6E73">the pressure</text>

  <text x="530" y="90" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="13" fill="#4A4A4D" letter-spacing="0.5">WHY</text>

  <text x="530" y="154" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="11" fill="#FFFFFF" letter-spacing="0.3">WHAT/HOW</text>

  <text x="530" y="300" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-style="italic" fill="#6E6E73">This essay's order</text>
</svg>
