<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fork diagram: proactive vs passive AI restructuring</title>
  <desc id="desc">From NOW, a proactive path leads to defining what's next; a passive path leads to forced restructure on worse terms. A 6-month half-life ticks along the timeline beneath.</desc>

  <!-- background -->
  <rect x="0" y="0" width="700" height="360" fill="#FFFFFF"/>

  <!-- connectors: straight lines, 90-degree elbows only -->
  <g stroke="#4A4A4D" stroke-width="2" fill="none">
    <!-- stem from NOW down to fork point -->
    <polyline points="350,80 350,140" />
    <!-- right branch: fork point -> right -> down into PROACTIVE -->
    <polyline points="350,140 530,140 530,170" />
    <!-- left branch: fork point -> left -> down into PASSIVE -->
    <polyline points="350,140 170,140 170,170" />
    <!-- PROACTIVE -> DEFINE WHAT'S NEXT -->
    <polyline points="530,220 530,250" />
    <!-- PASSIVE -> FORCED RESTRUCTURE -->
    <polyline points="170,220 170,250" />
  </g>

  <!-- NOW square -->
  <rect x="310" y="20" width="80" height="60" fill="#4A4A4D"/>
  <text x="350" y="56" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="18" fill="#FFFFFF">NOW</text>

  <!-- PROACTIVE rect (right arm) -->
  <rect x="460" y="170" width="140" height="50" fill="#3292FF"/>
  <text x="530" y="200" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="16" fill="#FFFFFF">PROACTIVE</text>

  <!-- DEFINE WHAT'S NEXT square -->
  <rect x="475" y="250" width="110" height="70" fill="#D1DDD4"/>
  <text x="530" y="280" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" fill="#4A4A4D">
    <tspan x="530" dy="0">DEFINE</tspan>
    <tspan x="530" dy="16">WHAT'S NEXT</tspan>
  </text>

  <!-- PASSIVE rect (left arm) -->
  <rect x="100" y="170" width="140" height="50" fill="#7BA3AD"/>
  <text x="170" y="200" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="16" fill="#FFFFFF">PASSIVE</text>

  <!-- FORCED RESTRUCTURE — WORSE TERMS square -->
  <rect x="95" y="250" width="150" height="70" fill="#FC7142"/>
  <text x="170" y="276" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" fill="#FFFFFF">
    <tspan x="170" dy="0">FORCED RESTRUCTURE</tspan>
    <tspan x="170" dy="16">WORSE TERMS</tspan>
  </text>

  <!-- timeline bar underneath both arms -->
  <rect x="60" y="333" width="580" height="6" fill="#D1DDD4"/>
  <!-- tick mark, centered under NOW -->
  <rect x="347" y="327" width="6" height="18" fill="#4A4A4D"/>
  <text x="350" y="356" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#4A4A4D">6-MONTH HALF-LIFE</text>
</svg>
