<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Taste converges, sense doesn't">
  <!-- background -->
  <rect x="0" y="0" width="700" height="330" fill="#FFFFFF"/>

  <!-- LEFT: TASTE panel -->
  <rect x="20" y="20" width="310" height="260" fill="#FC7142"/>

  <text x="45" y="65" font-family="'Rubik Mono One', monospace" font-size="26" fill="#FFFFFF">TASTE</text>
  <text x="45" y="88" font-family="'Manrope', sans-serif" font-size="13" fill="#FFFFFF">Verdict. Converges.</text>

  <!-- decreasing bars: gap shrinks with every model release -->
  <rect x="50"  y="140" width="40" height="120" fill="#FFFFFF"/>
  <rect x="110" y="170" width="40" height="90"  fill="#FFFFFF"/>
  <rect x="170" y="200" width="40" height="60"  fill="#FFFFFF"/>
  <rect x="230" y="230" width="40" height="30"  fill="#FFFFFF"/>

  <text x="70"  y="135" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">R1</text>
  <text x="130" y="165" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">R2</text>
  <text x="190" y="195" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">R3</text>
  <text x="250" y="225" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">R4</text>

  <!-- baseline for taste bars -->
  <rect x="45" y="260" width="230" height="3" fill="#FFFFFF"/>

  <!-- RIGHT: SENSE panel -->
  <rect x="370" y="20" width="310" height="260" fill="#3292FF"/>

  <text x="395" y="65" font-family="'Rubik Mono One', monospace" font-size="26" fill="#FFFFFF">SENSE</text>
  <text x="395" y="88" font-family="'Manrope', sans-serif" font-size="13" fill="#FFFFFF">Aim. Doesn't converge.</text>

  <!-- equal-height bars: sense never converges -->
  <rect x="400" y="180" width="40" height="80" fill="#7BA3AD"/>
  <rect x="460" y="180" width="40" height="80" fill="#7BA3AD"/>
  <rect x="520" y="180" width="40" height="80" fill="#7BA3AD"/>
  <rect x="580" y="180" width="40" height="80" fill="#7BA3AD"/>

  <text x="420" y="175" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">R1</text>
  <text x="480" y="175" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">R2</text>
  <text x="540" y="175" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">R3</text>
  <text x="600" y="175" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">R4</text>

  <!-- baseline for sense bars -->
  <rect x="395" y="260" width="230" height="3" fill="#FFFFFF"/>

  <!-- divider: strict horizontal split at bottom -->
  <rect x="20" y="292" width="660" height="8" fill="#4A4A4D"/>

  <!-- caption -->
  <text x="350" y="318" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4A4A4D" text-anchor="middle">Automate the file. Defend the stance.</text>
</svg>
