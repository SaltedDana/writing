<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="320" fill="#FFFFFF" />

  <!-- Top row: wrong order (small, secondary) -->
  <rect x="30" y="30" width="120" height="50" rx="0" fill="none" stroke="#4A4A4D" stroke-width="1.5" />
  <text x="90" y="60" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="13" fill="#FC7142">AI FIRST</text>
  <line x1="30" y1="30" x2="150" y2="80" stroke="#FC7142" stroke-width="2" />
  <line x1="30" y1="80" x2="150" y2="30" stroke="#FC7142" stroke-width="2" />

  <text x="170" y="60" font-family="'Manrope', sans-serif" font-size="12" fill="#6E6E73">wrong order</text>

  <!-- divider line -->
  <line x1="30" y1="110" x2="670" y2="110" stroke="rgba(17,17,17,0.12)" stroke-width="1" />

  <!-- Main row: PEN AND PAPER -->
  <rect x="60" y="150" width="200" height="120" rx="0" fill="#D1DDD4" />
  <text x="160" y="205" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="18" fill="#4A4A4D">PEN AND</text>
  <text x="160" y="230" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="18" fill="#4A4A4D">PAPER</text>
  <text x="160" y="255" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4A4A4D">mind map, numbered</text>
  <text x="160" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4A4A4D">priorities</text>

  <!-- Arrow: 90-degree elbow style straight arrow -->
  <line x1="260" y1="210" x2="420" y2="210" stroke="#4A4A4D" stroke-width="2" />
  <line x1="420" y1="210" x2="405" y2="200" stroke="#4A4A4D" stroke-width="2" />
  <line x1="420" y1="210" x2="405" y2="220" stroke="#4A4A4D" stroke-width="2" />

  <!-- Main row: AI -->
  <rect x="420" y="150" width="200" height="120" rx="0" fill="#3292FF" />
  <text x="520" y="215" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="20" fill="#FFFFFF">AI</text>
  <text x="520" y="245" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">accelerates, doesn't</text>
  <text x="520" y="260" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">replace judgment</text>
</svg>
