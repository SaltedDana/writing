<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Entrepreneur journey, six stages, stage three highlighted">
  <rect x="0" y="0" width="900" height="220" fill="#FFFFFF"/>

  <!-- Stage 1: Uninformed Optimism -->
  <rect x="40" y="55" width="110" height="110" fill="#D1DDD4"/>
  <text x="52" y="80" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#4A4A4D">1</text>
  <text x="95" y="187" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">UNINFORMED</text>
  <text x="95" y="203" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">OPTIMISM</text>

  <!-- Stage 2: Informed Pessimism -->
  <rect x="170" y="55" width="110" height="110" fill="#D1DDD4"/>
  <text x="182" y="80" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#4A4A4D">2</text>
  <text x="225" y="187" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">INFORMED</text>
  <text x="225" y="203" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">PESSIMISM</text>

  <!-- Stage 3: Crisis of Meaning (pivot, larger, orange, ink outline) -->
  <rect x="300" y="45" width="130" height="130" fill="#FC7142" stroke="#4A4A4D" stroke-width="3"/>
  <text x="314" y="73" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
  <text x="365" y="197" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="13" fill="#FFFFFF">CRISIS OF</text>
  <text x="365" y="214" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="13" fill="#FFFFFF">MEANING</text>

  <!-- Stage 4: Crash or Survive -->
  <rect x="450" y="55" width="110" height="110" fill="#D1DDD4"/>
  <text x="462" y="80" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#4A4A4D">4</text>
  <text x="505" y="187" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">CRASH OR</text>
  <text x="505" y="203" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">SURVIVE</text>

  <!-- Stage 5: Informed Optimism -->
  <rect x="580" y="55" width="110" height="110" fill="#D1DDD4"/>
  <text x="592" y="80" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#4A4A4D">5</text>
  <text x="635" y="187" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">INFORMED</text>
  <text x="635" y="203" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">OPTIMISM</text>

  <!-- Stage 6: Growth & Momentum -->
  <rect x="710" y="55" width="110" height="110" fill="#D1DDD4"/>
  <text x="722" y="80" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#4A4A4D">6</text>
  <text x="765" y="187" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">GROWTH &amp;</text>
  <text x="765" y="203" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="12" fill="#4A4A4D">MOMENTUM</text>
</svg>
