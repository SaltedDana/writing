<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="760" height="260" fill="#FFFFFF" />

  <!-- Square 1: OBSERVE -->
  <rect x="50" y="20" width="140" height="140" fill="#D1DDD4" />
  <text x="66" y="48" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4A4A4D">1</text>
  <text x="120" y="96" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4A4A4D">OBSERVE</text>

  <!-- Square 2: COMMIT EARLY -->
  <rect x="210" y="20" width="140" height="140" fill="#CDACFE" />
  <text x="226" y="48" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4A4A4D">2</text>
  <text x="280" y="92" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4A4A4D">COMMIT</text>
  <text x="280" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4A4A4D">EARLY</text>

  <!-- Square 3: REMOVE FRICTION -->
  <rect x="370" y="20" width="140" height="140" fill="#3292FF" />
  <text x="386" y="48" font-family="'JetBrains Mono', monospace" font-size="16" fill="#FFFFFF">3</text>
  <text x="440" y="92" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#FFFFFF">REMOVE</text>
  <text x="440" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#FFFFFF">FRICTION</text>

  <!-- Square 4: BUILD CAPABILITY -->
  <rect x="530" y="20" width="140" height="140" fill="#FC7142" />
  <text x="546" y="48" font-family="'JetBrains Mono', monospace" font-size="16" fill="#FFFFFF">4</text>
  <text x="600" y="92" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#FFFFFF">BUILD</text>
  <text x="600" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#FFFFFF">CAPABILITY</text>

  <!-- Feed bar beneath all four squares -->
  <rect x="50" y="190" width="620" height="12" fill="#4A4A4D" />

