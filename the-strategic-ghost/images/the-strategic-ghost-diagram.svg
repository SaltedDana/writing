<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg">
  <!-- June design system: flat 90-degree blocks, no rounded corners, no gradients/shadows/circles -->
  <rect x="0" y="0" width="760" height="220" fill="#FFFFFF" />

  <!-- Block 1: GHOST -->
  <rect x="10" y="40" width="150" height="150" rx="0" fill="#4A4A4D" />
  <text x="85" y="105" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="18" fill="#FFFFFF">GHOST</text>
  <text x="85" y="130" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" fill="#F5F9FC">unnamed</text>
  <text x="85" y="146" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" fill="#F5F9FC">fear</text>

  <!-- Arrow 1 -->
  <line x1="163" y1="115" x2="197" y2="115" stroke="#4A4A4D" stroke-width="3" />
  <polygon points="197,108 210,115 197,122" fill="#4A4A4D" />

  <!-- Block 2: NAME IT -->
  <rect x="207" y="40" width="150" height="150" rx="0" fill="#7BA3AD" />
  <text x="282" y="98" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="16" fill="#FFFFFF">NAME IT</text>
  <text x="282" y="126" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" fill="#4A4A4D">what feels</text>
  <text x="282" y="142" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" fill="#4A4A4D">risky to say?</text>

  <!-- Arrow 2 -->
  <line x1="360" y1="115" x2="394" y2="115" stroke="#4A4A4D" stroke-width="3" />
  <polygon points="394,108 407,115 394,122" fill="#4A4A4D" />

  <!-- Block 3: LIMIT AIRTIME -->
  <rect x="404" y="40" width="150" height="150" rx="0" fill="#CDACFE" />
  <text x="479" y="108" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="15" fill="#4A4A4D">LIMIT</text>
  <text x="479" y="130" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="15" fill="#4A4A4D">AIRTIME</text>

  <!-- Arrow 3 -->
  <line x1="557" y1="115" x2="591" y2="115" stroke="#4A4A4D" stroke-width="3" />
  <polygon points="591,108 604,115 591,122" fill="#4A4A4D" />

  <!-- Block 4: GHOST LOSES POWER (outline only, unfilled) -->
  <rect x="601" y="40" width="150" height="150" rx="0" fill="none" stroke="#4A4A4D" stroke-width="3" />
  <text x="676" y="105" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="14" fill="#4A4A4D">GHOST</text>
  <text x="676" y="123" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="14" fill="#4A4A4D">LOSES</text>
  <text x="676" y="141" text-anchor="middle" font-family="'Rubik Mono One', monospace" font-size="14" fill="#4A4A4D">POWER</text>
</svg>
