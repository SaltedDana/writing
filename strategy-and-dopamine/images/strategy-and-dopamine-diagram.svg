<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <!-- June design system: flat blocks, rx=0, no gradients, no shadows, no curves -->

  <!-- background -->
  <rect x="0" y="0" width="700" height="320" fill="#F5F9FC"/>

  <!-- LEFT GROUP: OUTCOME-ONLY -->
  <rect x="0" y="0" width="340" height="320" fill="#7BA3AD"/>

  <text x="170" y="40" text-anchor="middle"
        font-family="'Rubik Mono One', monospace" font-size="18" fill="#FFFFFF"
        letter-spacing="1">OUTCOME-ONLY</text>

  <!-- baseline -->
  <rect x="60" y="249" width="220" height="2" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- bars: tall to near-zero -->
  <rect x="68" y="100" width="36" height="150" fill="#FFFFFF"/>
  <rect x="124" y="150" width="36" height="100" fill="#FFFFFF"/>
  <rect x="180" y="210" width="36" height="40" fill="#FFFFFF"/>
  <rect x="236" y="240" width="36" height="10" fill="#FFFFFF"/>

  <!-- time markers -->
  <text x="86" y="268" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Nov</text>
  <text x="142" y="268" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Dec</text>
  <text x="198" y="268" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Jan</text>
  <text x="254" y="268" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Feb</text>

  <!-- caption -->
  <text x="170" y="296" text-anchor="middle"
        font-family="'JetBrains Mono', monospace" font-size="14" font-style="italic" fill="#FFFFFF">quits by February</text>

  <!-- RIGHT GROUP: PROCESS-LINKED -->
  <rect x="360" y="0" width="340" height="320" fill="#FC7142"/>

  <text x="530" y="40" text-anchor="middle"
        font-family="'Rubik Mono One', monospace" font-size="18" fill="#FFFFFF"
        letter-spacing="1">PROCESS-LINKED</text>

  <!-- baseline -->
  <rect x="420" y="249" width="220" height="2" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- bars: level to slightly rising -->
  <rect x="428" y="160" width="36" height="90" fill="#FFFFFF"/>
  <rect x="484" y="155" width="36" height="95" fill="#FFFFFF"/>
  <rect x="540" y="145" width="36" height="105" fill="#FFFFFF"/>
  <rect x="596" y="135" width="36" height="115" fill="#FFFFFF"/>

  <!-- time markers -->
  <text x="446" y="268" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Nov</text>
  <text x="502" y="268" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Dec</text>
  <text x="558" y="268" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Jan</text>
  <text x="614" y="268" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Feb</text>

  <!-- caption -->
  <text x="530" y="296" text-anchor="middle"
        font-family="'JetBrains Mono', monospace" font-size="14" font-style="italic" fill="#FFFFFF">momentum holds</text>

  <!-- divider -->
  <rect x="349" y="0" width="2" height="320" fill="#4A4A4D" fill-opacity="0.12"/>
</svg>
